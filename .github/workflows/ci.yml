name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --log-opts="--all" --redact
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install pre-commit==4.2.0 sqlfluff==3.3.1
      - run: pre-commit run --all-files
      - run: bash -n docker/db/init.sh docker/docker-entrypoint.sh
      - run: sqlfluff lint --dialect postgres tools/*.sql

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: docker build --tag postgresql-scripts-ci:local docker
      - name: Initialize PostgreSQL
        run: |
          docker run --detach --name postgresql-scripts-ci \
            --env POSTGRES_PASSWORD=ci-postgres-password \
            --env DC_ADMIN_USER=dc_admin \
            --env DC_ADMIN_USER_PASSWORD=ci-admin-password-1 \
            --env DC_READONLY_USER=dc_readonly_user \
            --env DC_READONLY_USER_PASSWORD=ci-readonly-password-1 \
            --env DC_DB=dc_db \
            postgresql-scripts-ci:local
      - name: Verify bootstrap state
        run: |
          for attempt in {1..60}; do
            result=$(docker exec postgresql-scripts-ci psql -U postgres -d dc_db \
              -v ON_ERROR_STOP=1 -tAc \
              "SELECT to_regnamespace('tools') IS NULL, to_regnamespace('dba_advisor') IS NULL, pg_has_role('dc_readonly_user', 'readonly', 'member');" \
              2>/dev/null || true)
            if [ "$result" = 't|t|t' ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs postgresql-scripts-ci
          exit 1
      - name: Create diagnostic fixtures
        run: |
          docker exec postgresql-scripts-ci psql -U postgres -d dc_db \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE public.example_table (id integer)' \
            -c 'CREATE INDEX example_index ON public.example_table (id)' \
            -c 'INSERT INTO public.example_table SELECT * FROM generate_series(1, 1000)' \
            -c 'ANALYZE public.example_table'
      - name: Install diagnostic views
        run: |
          docker cp tools postgresql-scripts-ci:/tools
          for script in tools/0[0-6]*.sql; do
            docker exec postgresql-scripts-ci psql -U postgres -d dc_db \
              -v ON_ERROR_STOP=1 -f "/$script"
          done
      - name: Query every diagnostic view
        run: |
          view_scripts=(tools/0[1-6]0_v_*.sql)
          expected=${#view_scripts[@]}
          view_count=$(docker exec postgresql-scripts-ci psql -U postgres -d dc_db \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM pg_views WHERE schemaname = 'dba_advisor'")
          [ "$view_count" -eq "$expected" ]
          echo "SELECT format('SELECT count(*) FROM %I.%I;', schemaname, viewname) FROM pg_views WHERE schemaname = 'dba_advisor' ORDER BY viewname \gexec" \
            | docker exec --interactive postgresql-scripts-ci psql -U postgres -d dc_db \
              -v ON_ERROR_STOP=1
      - name: Run standalone diagnostic queries
        run: |
          for script in tools/0[7-9]*.sql tools/1*.sql tools/2*.sql; do
            docker exec postgresql-scripts-ci psql -U postgres -d dc_db \
              -v ON_ERROR_STOP=1 -f "/$script"
          done
      - if: always()
        run: docker rm --force --volumes postgresql-scripts-ci || true
